<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting to booking...</title>
    <script>
        (function() {
            var base = 'https://cal.com/ludovic-bostral-ludobos-idg16l';
            // Deux langues, comme le site. Les slugs zh et es renvoyaient 404 sur cal.com.
            var slugs = {
                consultation: { en: '30min-en', fr: '30min-fr' },
                rapport: {
                    en: 'vertical-invasion-2026-report-discussion',
                    fr: 'vertical-invasion-2026-discussion-rapport-fr'
                }
            };

            // 1. Check URL param ?lang=xx
            var params = new URLSearchParams(window.location.search);
            var lang = params.get('lang');

            // 2. Check localStorage (same key as main site)
            if (!lang) {
                try { lang = localStorage.getItem('preferredLanguage'); } catch(e) {}
            }

            // 3. Detect from browser
            if (!lang) {
                var browserLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
                lang = browserLang.startsWith('fr') ? 'fr' : 'en';
            }

            // Normalize : tout ce qui n'est pas fr part sur l'evenement anglais
            if (lang !== 'fr') lang = 'en';

            // ?t=rapport : discussion du rapport ; sinon consultation generique
            var type = params.get('t') === 'rapport' ? 'rapport' : 'consultation';

            // Origine lue par le webhook du Worker (metadata[...], jamais utm_* simples).
            // Les crochets restent litteraux : c'est la forme testee contre cal.com.
            function meta(key, value) { return 'metadata[' + key + ']=' + encodeURIComponent(value); }
            var query = ['locale=' + lang];
            ['name', 'email'].forEach(function(k) {
                if (params.get(k)) query.push(k + '=' + encodeURIComponent(params.get(k)));
            });
            query.push(meta('utm_source', params.get('utm_source') || 'bostral'));
            query.push(meta('utm_medium', params.get('utm_medium') || 'call'));
            if (params.get('utm_campaign')) query.push(meta('utm_campaign', params.get('utm_campaign')));
            if (params.get('lead_id')) query.push(meta('lead_id', params.get('lead_id')));

            window.location.replace(base + '/' + slugs[type][lang] + '?' + query.join('&'));
        })();
    </script>
</head>
<body>
    <p>Redirecting to booking page...</p>
</body>
</html>
